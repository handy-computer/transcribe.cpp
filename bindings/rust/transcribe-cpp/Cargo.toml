[package]
name = "transcribe-cpp"
version = "0.5.0"
edition = "2021"
# As transcribe-cpp-sys (its generated FFI needs 1.82). transcribe-cpp-types
# alone builds on 1.74.
rust-version = "1.82"
description = "Rust bindings for transcribe.cpp, a C/C++ speech-to-text library built on ggml"
license = "MIT"
readme = "README.md"
repository = "https://github.com/handy-computer/transcribe.cpp"
homepage = "https://github.com/handy-computer/transcribe.cpp"
keywords = ["transcription", "speech", "asr", "stt", "ggml"]
categories = ["multimedia::audio", "api-bindings"]
# A unique `links` name so build.rs can re-emit the -sys crate's location
# metadata one more hop (as DEP_TRANSCRIBE_CPP_*) for downstream packaging. No
# native linking happens here — that lives in -sys. See build.rs.
links = "transcribe_cpp"

[lib]
name = "transcribe_cpp"
path = "src/lib.rs"

[features]
# These mirror transcribe-cpp-sys: enabling a backend here just forwards the
# feature to the -sys crate, which forwards it to the CMake build.
default = ["metal"]
metal = ["transcribe-cpp-sys/metal"]
vulkan = ["transcribe-cpp-sys/vulkan"]
cuda = ["transcribe-cpp-sys/cuda"]
rocm = ["transcribe-cpp-sys/rocm"]
openmp = ["transcribe-cpp-sys/openmp"]
# `shared` links a shared libtranscribe; `dynamic-backends` additionally ships
# each compute backend as a runtime-loaded module (and implies `shared`, both
# here so CARGO_FEATURE_SHARED is set for this crate's build.rs rpath gate, and
# via the -sys feature). See notes/rust-dynamic-backends-plan.md.
shared = ["transcribe-cpp-sys/shared"]
dynamic-backends = ["shared", "transcribe-cpp-sys/dynamic-backends"]
# Serialize/Deserialize on the plain-data option and result types (not handles),
# Serialize on Error, and Serialize/Deserialize on its ErrorReport snapshot. No
# native-build impact. The plain-data types live in transcribe-cpp-types, so
# this forwards there; `dep:serde` is for Error's own Serialize impl.
serde = ["dep:serde", "transcribe-cpp-types/serde"]

[dependencies]
# default-features = false so the safe crate's own features are the ONLY control
# surface: without it, sys's `default = ["metal"]` stays active even under
# `transcribe-cpp --no-default-features`, silently re-enabling Metal. The backend
# features below forward explicitly, so the default (`metal`) still reaches sys
# via `metal = ["transcribe-cpp-sys/metal"]`.
transcribe-cpp-sys = { version = "0.5.0", path = "../../..", default-features = false }
# The plain-data types (options, results, errors), re-exported at this crate's
# root. Pinned EXACTLY: the family-extension enums are #[non_exhaustive], so
# their conversions to the C structs here need a `_` arm the compiler cannot
# check, and only lockstep versions guarantee every variant has a mapping
# (Task / Feature / ExtSlot carry their C value in the types crate instead).
# scripts/release/prepare.py keeps the pin in step with the release version.
transcribe-cpp-types = { version = "=0.5.0", path = "../transcribe-cpp-types" }
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
hound = "3"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde_json = "1"
