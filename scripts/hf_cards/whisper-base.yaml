# Spec for the HF README of handy-computer/whisper-base-gguf.
# Prose only; numbers and metadata come from catalog/<variant>.json. See README.md.

pin_date: 2026-04-25

validation:
  reference: transformers
  commit: 0a26478
  date: 2026-09-13

pipeline_tag: automatic-speech-recognition
tags:
  - gguf
  - transcribe.cpp
  - asr
  - speech-to-text
  - whisper
