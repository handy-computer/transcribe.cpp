# Spec for the HF README of handy-computer/parakeet-tdt-0.6b-v2-gguf.
# Prose only; numbers and metadata come from catalog/<variant>.json. See README.md.

pin_date: 2026-04-15

# Validation pin for the most recent upload. Updated on each release —
# older HF revisions carry whatever value was current at their upload time.
validation:
  reference: NeMo
  commit: bf0d0b7
  date: 2026-04-18

pipeline_tag: automatic-speech-recognition
tags:
  - gguf
  - transcribe.cpp
  - asr
  - speech-to-text
  - parakeet
  - conformer
  - rnnt
  - tdt

summary: |
  Offline English speech-to-text. A Conformer encoder with a TDT/RNNT transducer
  decoder. Takes a 16 kHz mono WAV and produces a transcript with optional
  token-level timestamps. Not a streaming model; no multilingual capability (see
  v3 for that).

wer:
  # metadata_key: librispeech_test_clean  # names the wer_<key> field; override when scored on another corpus
  notes: |
    Greedy transducer decoding, no external LM. F32 reference baseline: 1.68%. NVIDIA's
    self-reported number on the same split is 1.69%, so the F32 and Q8_0 ports match the
    upstream reference within rounding.
