# Spec for the HF README of handy-computer/granite-4.0-1b-speech-gguf.
# Prose only; numbers and metadata come from catalog/<variant>.json. See README.md.

pin_date: 2026-05-17

validation:
  reference: Transformers
  commit: 275332d
