summary: |
  Offline Arabic speech-to-text, including dialectal Arabic and
  Arabic-English code-switching, with English as a secondary language. An
  Arabic-focused adaptation of the Cohere Transcribe 03-2026 architecture:
  a Conformer encoder with a Transformer encoder-decoder head
  (cross-attention, tied token embedding). Takes a 16 kHz mono WAV and a
  language flag (`-l ar` or `-l en`) and produces a transcript. Decoding
  is autoregressive.

usage: |
  Build transcribe.cpp from source:

  ```bash
  git clone git@github.com:handy-computer/transcribe.cpp.git
  cd transcribe.cpp
  cmake -B build && cmake --build build
  ```

  Run on a 16 kHz mono WAV:

  ```bash
  build/bin/transcribe-cli \
    -m cohere-transcribe-arabic-07-2026-Q8_0.gguf \
    -l ar \
    input.wav
  ```

  If your audio isn't already 16 kHz mono WAV, convert it first:

  ```bash
  ffmpeg -i input.mp3 -ar 16000 -ac 1 output.wav
  ```

  See the [transcribe.cpp model page](https://github.com/handy-computer/transcribe.cpp/blob/main/docs/models/cohere-transcribe-arabic-07-2026.md) for performance
  numbers, numerical validation, and reproduction steps.

default_quant_index: 2  # Q8_0

