# Spec for the HF README of handy-computer/parakeet-tdt_ctc-1.1b-gguf.
# Prose only; numbers and metadata come from catalog/<variant>.json. See README.md.

pin_date: 2026-05-10

# Validation pin for the most recent upload. Updated on each release —
# older HF revisions carry whatever value was current at their upload time.
validation:
  reference: NeMo
  commit: 42528dd
  date: 2026-05-10

pipeline_tag: automatic-speech-recognition
tags:
  - gguf
  - transcribe.cpp
  - asr
  - speech-to-text
  - parakeet
  - conformer
  - rnnt
  - tdt

summary: |
  Offline English speech-to-text with punctuation and capitalization. A FastConformer-XL encoder with a TDT/RNNT transducer decoder (the auxiliary CTC head from the upstream hybrid checkpoint is dropped at convert time). Not a streaming model and does not translate.

wer:
  notes: |
    Greedy TDT/RNN-T transducer decoding, no external LM. F32 reference baseline: 1.87%.
    NVIDIA's self-reported number on the same split is 1.82%.
