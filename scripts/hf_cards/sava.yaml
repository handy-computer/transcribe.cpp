summary: |
  End-of-turn and speech detection by Inworld, for live audio. Every 40 ms
  it gives the probability that the speaker has finished their turn, and
  whether the audio is speech. Not a transcription model. Any language. CPU
  is the default backend.
wer:
  notes: |
    A clip counts as complete when its last frame's turn probability is
    above 0.5, the rule of Inworld's benchmark (the API's default cut-off is
    0.9). False positives: incomplete clips called complete; false negatives:
    the reverse. The reference is Inworld's own PyTorch model on the same
    clips (93.36%, AUC 0.97946; Inworld publishes 93.35% and 0.97946).
usage: |
  Build transcribe.cpp and run on a mono 16 kHz WAV:

  ```bash
  cmake -B build && cmake --build build --target transcribe-cli
  build/bin/transcribe-cli -m sava-Q8_0.gguf recording.wav
  # turn: p=0.998245 ended=1 threshold=0.90
  ```

  For live audio, feed it with `transcribe_turn_stream_feed`
  (`include/transcribe/turn.h`); each 40 ms frame gets a turn probability
  and a speech probability. Your code decides when to answer;
  `examples/turn_live` shows Inworld's rule.

  See [the model page](https://github.com/handy-computer/transcribe.cpp/blob/main/docs/models/sava.md)
  and [turn detection](https://github.com/handy-computer/transcribe.cpp/blob/main/docs/turn.md).
