summary: |
  Streaming end-of-turn and voice activity detection by Inworld: every 40 ms
  it gives the probability that the speaker's turn has ended and, 120 ms
  later, the probability that the frame held speech. Not a transcription
  model: it serves the TURN role (live stream or whole clip, with Inworld's
  turn rule cutting a clip into turns) and the VAD role. Any language. CPU is
  the default backend.
usage: |
  Build transcribe.cpp and run on a mono 16 kHz WAV:

  ```bash
  cmake -B build && cmake --build build --target transcribe-cli
  build/bin/transcribe-cli -m sava-Q8_0.gguf recording.wav
  ```

  From the C API, use the TURN role (`include/transcribe/turn.h`):
  `transcribe_turn_stream_feed` / `transcribe_turn_stream_flush` for live
  audio (per-frame turn and speech scores), or `transcribe_turn_run` on a
  whole clip (the last frame's `p` and `ended`, per-frame scores, and turns).
  The VAD role (`include/transcribe/vad.h`) returns the speech track alone.

  See [the model page](https://github.com/handy-computer/transcribe.cpp/blob/main/docs/models/sava.md)
  and [turn detection](https://github.com/handy-computer/transcribe.cpp/blob/main/docs/turn.md).
