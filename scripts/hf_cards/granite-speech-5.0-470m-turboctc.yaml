# Spec for the HF README of handy-computer/granite-speech-5.0-470m-turboctc-gguf.
# Consumed by scripts/hf_cards/generate.py.

hf_repo: ibm-granite/granite-speech-5.0-470m-turboctc
target_repo: handy-computer/granite-speech-5.0-470m-turboctc-gguf
transcribe_docs_url: https://github.com/handy-computer/transcribe.cpp/blob/main/docs/models/granite-speech-5.0-470m-turboctc.md

upstream_commit: 18ca3c1
pin_date: 2026-09-12

# Validation pin for the most recent upload. Updated on each release —
# older HF revisions carry whatever value was current at their upload time.
validation:
  reference: transformers
  commit: b9427cf
  date: 2026-09-12

license: apache-2.0
license_display: Apache-2.0
pipeline_tag: automatic-speech-recognition
languages:
  - en
tags:
  - gguf
  - transcribe.cpp
  - asr
  - speech-to-text
  - granite
  - conformer
  - ctc

summary: |
  Offline English speech-to-text. A 470M parameter Granite Conformer encoder
  with a self-conditioned CTC head.
  Takes a 16 kHz mono WAV and produces a transcript. Not a streaming model. English only.

default_quant_index: 2  # Q8_0

# Capability flags for the transcribe_cpp metadata block.
capabilities:
  streaming: false
  translate: false
  lang_detect: false
  timestamps: none  # none | segment | word | token

# Speedup-over-realtime (×RT) per rig/backend, hand-authored from the bench;
# published raw as rtf_<machine> in the metadata block.
perf:
  m4-max:
    cpu: 49
    metal: 353
  m4:
    cpu: 29
    metal: 130
  ryzen-4750u:
    cpu: 15.5
    vulkan: 20.5

wer:
  source: LibriSpeech test-clean
  notes: |
    WER measured on the full LibriSpeech test-clean split (2620 utterances),
    greedy CTC decoding, no external LM. Measured reference baseline
    (transformers 5.17.0, F32, CPU): 1.33%, 95% CI [1.20, 1.47].

