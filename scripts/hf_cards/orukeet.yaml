# Spec for the HF README of handy-computer/orukeet-gguf.
# Prose only; numbers and metadata come from catalog/<variant>.json. See README.md.

pin_date: 2026-10-06

validation:
  reference: NeMo
  commit: 65856fac
  date: 2026-10-06

pipeline_tag: automatic-speech-recognition
