# Spec for the HF README of handy-computer/canary-1b-gguf.
# Prose only; numbers and metadata come from catalog/<variant>.json. See README.md.
#
# canary-1b is the only family member under a non-commercial license.
# The converter writes general.license="CC-BY-NC-4.0" and
# general.license.link=https://creativecommons.org/licenses/by-nc/4.0/
# into every preset; the YAML below mirrors that distinction so the HF
# card surfaces the constraint to anyone clicking through to download.

pin_date: 2026-05-08

validation:
  reference: NeMo
  commit: db53eda
  date: 2026-05-08

pipeline_tag: automatic-speech-recognition
tags:
  - gguf
  - transcribe.cpp
  - asr
  - speech-to-text
  - canary
  - multitask-aed
  - encoder-decoder
  - translation
  - non-commercial

summary: |
  Offline multilingual speech-to-text and translation. A multitask AED
  with a 24-layer FastConformer encoder and a 24-layer Transformer
  decoder — the original canary release. Supports automatic speech
  recognition in English, German, Spanish, and French, and translation
  between supported pairs. Takes a 16 kHz mono WAV and produces a
  transcript. Not a streaming model. **License: CC-BY-NC-4.0
  (non-commercial only)** — the only canary variant under a
  non-commercial license.

wer:
  notes: |
    Greedy decoding, no external LM. F32 reference baseline: 1.55%. NVIDIA's
    self-reported number on the upstream model card is 1.48%; likely this is due to
    differences in how we score WER, based on the results we have from
    canary-180m-flash.
